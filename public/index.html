<style>

svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#burger{background:transparent;color:var(--text);padding:6px}

.chip.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{cursor:pointer}
.th{aspect-ratio:16/9;border-radius:12px;position:relative;overflow:hidden;display:grid;place-items:center;font-size:2rem;color:#fff}
.th video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.tag.s{left:8px;right:auto;background:#b45309}
.card h3{margin:8px 0 2px;font-size:.95rem}
.meta{color:var(--muted);font-size:.8rem}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.box{display:grid;gap:12px;max-width:520px;margin:0 auto}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.sec h3{margin:0;font-size:1rem}
.vbox{background:#000;border-radius:12px;overflow:hidden;display:grid;place-items:center;max-width:720px;margin:0 auto}
.vbox video{width:100%;max-height:72vh;display:block;background:#000}
.vbox.s{max-width:380px}
.ph{aspect-ratio:16/9;width:100%;display:grid;place-items:center;color:#fff;text-align:center;padding:12px;font-size:.95rem}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}

dialog{border:0;border-radius:16px;padding:0;width:min(420px,94vw);background:var(--surface);color:var(--text)}

#toast.show{opacity:1;transform:translateX(-50%)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;background:var(--surface);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px))}

nav .mid{color:var(--text)}nav .mid.on::before{display:none}

:root[data-theme="dark"]{--bg:#09080e;--surface:#110f17;--line:#26232f;--accent:#b794f6}
.hr{display:flex;align-items:center;gap:2px}
.hr button{background:transparent;color:var(--text);padding:7px}
main.flush{padding:0 0 14px;max-width:1100px}

button{transition:transform .12s,opacity .2s,background .2s}

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>Number(n).toLocaleString("ru-RU");
const cnt=n=>n>=1e6?(n/1e6).toFixed(1)+" mln":n>=1e4?Math.round(n/1e3)+" ming":n>=1e3?(n/1e3).toFixed(1)+" ming":String(Math.round(n));
const mmss=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
const slug=s=>(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const MON=["yan","fev","mart","apr","may","iyun","iyul","avg","sen","okt","noy","dek"];
const dstr=t=>{const d=new Date(t);return d.getDate()+" "+MON[d.getMonth()]};
/* ===== SOZLAMALAR: server ulanganda API_URL ni yozing (masalan https://api.sizning-sayt.uz) ===== */
const CFG={API_URL:"",RTMP_URL:"",HLS_BASE:""};
const SMS={
  async send(p){if(!CFG.API_URL)throw new Error("NO_SERVER");const r=await fetch(CFG.API_URL+"/sms/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:"+998"+p})});if(!r.ok)throw new Error("FAIL")},
  async verify(p,code){if(!CFG.API_URL)throw new Error("NO_SERVER");const r=await fetch(CFG.API_URL+"/sms/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:"+998"+p,code})});if(!r.ok)return false;const j=await r.json().catch(()=>({}));return j.ok!==false}
};
const RATE=12500,HOLD=3*864e5,DAY=864e5;
const PLANS=[{k:"w",l:"1 hafta",usd:5,ms:7*DAY},{k:"m",l:"1 oy",usd:30,ms:30*DAY},{k:"q",l:"3 oy",usd:90,ms:90*DAY},{k:"y",l:"1 yil",usd:300,ms:365*DAY,note:"Chegirma bilan"}];
const ADS=[{k:"d1",l:"1 kun",usd:3,ms:DAY},{k:"d3",l:"3 kun",usd:8,ms:3*DAY},{k:"d7",l:"7 kun",usd:15,ms:7*DAY}];
const rd=(k,d)=>{try{const x=JSON.parse(localStorage.getItem(k));return x&&typeof x==="object"?x:d}catch(e){return d}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast("Brauzer xotirasi toʻlgan")}};
let S=Object.assign({lk:{},sv:{},cm:{},hist:[],later:{},theme:"auto",age:"",auto:true},rd("vidly",{}));
let G=Object.assign({users:{},subs:{},views:{},secs:{},bonus:{},mon:{},wd:[],admins:[],pay:[],cfg:{card:"",holder:""},ads:{},live:{}},rd("vidly_g",{}));
const saveS=()=>wr("vidly",S),saveG=()=>wr("vidly_g",G);
let me=localStorage.getItem("vidly_me")||"";if(!G.users[me])me="";
let vidk=localStorage.getItem("vidly_vid");if(!vidk){vidk=Math.random().toString(36).slice(2,10);try{localStorage.setItem("vidly_vid",vidk)}catch(e){}}
const vk=()=>me||("g:"+vidk);
const setMe=u=>{me=u;try{localStorage.setItem("vidly_me",u)}catch(e){}};
const rid=()=>"a"+Math.random().toString(36).slice(2,9);
const taken=(u,except)=>Object.values(G.users).some(x=>x.user===u&&x.uid!==except);
function mkUser(ch,user,avatar,banner){const uid=rid();G.users[uid]={uid,ch,user,avatar:avatar||"",banner:banner||"",ts:Date.now(),phone:"",phoneOk:false};saveG();return uid}
if(!me&&S.ch&&!Object.keys(G.users).length){let u=slug(S.hd||S.ch)||"kanal",b=u,i=1;while(taken(u))u=b+"-"+(++i);setMe(mkUser(S.ch,u,S.avatar,S.banner))}
const isAdmin=u=>!!(u&&G.users[u]&&(G.users[u].user==="vidly"||G.admins.includes(u)));
const isSample=id=>id.startsWith("c-");
const sbase=id=>{let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))%18000;return 2500+h};
const subsOf=id=>Object.keys(G.subs[id]||{}).length+(G.bonus[id]||0)+(isSample(id)?sbase(id):0);
const isSub=id=>!!(G.subs[id]||{})[vk()];
const toggleSub=id=>{G.subs[id]=G.subs[id]||{};if(G.subs[id][vk()])delete G.subs[id][vk()];else G.subs[id][vk()]=Date.now();saveG()};
const subCountOf=k=>Object.values(G.subs).filter(o=>o&&o[k]).length;
const grads=["#7c3aed,#db2777","#0ea5e9,#6366f1","#059669,#0ea5e9","#d97706,#dc2626","#db2777,#d97706","#0d9488,#7c3aed"];
const cats=["Musiqa","Oʻyin","Taʼlim","Sayohat","Kulgi"];
let vids=[["Toshkent tungi koʻchalari","Sayohat","SafarTV",124000,"8:12","long","3 kun oldin"],["Python 30 daqiqada","Taʼlim","KodUz",310000,"30:05","long","1 hafta oldin"],["Eng yaxshi lahzalar","Oʻyin","GamerBek",88000,"12:40","long","2 hafta oldin"],["Registon — 15 soniya","Sayohat","SafarTV",201000,"0:15","short","1 oy oldin"],["Kulgili hayvonlar","Kulgi","KulguLab",520000,"0:30","short","4 kun oldin"],["Matematika oson","Taʼlim","IlmMaktab",76000,"15:20","long","6 kun oldin"],["Bahor qoʻshigʻi (akustik)","Musiqa","NavoMusic",45000,"4:21","long","3 hafta oldin"],["Choyxona sirlari","Sayohat","SafarTV",98000,"0:22","short","2 kun oldin"],["Bir daqiqada ingliz tili","Taʼlim","IlmMaktab",143000,"0:45","short","5 kun oldin"],["Gol! 😮","Oʻyin","GamerBek",67000,"0:12","short","1 hafta oldin"]]
.map((v,i)=>({id:"s"+(i+1),t:v[0],c:v[1],ch:v[2],base:v[3],d:v[4],kind:v[5],ago:v[6],g:grads[i%6],sample:true,owner:""}));
const chId=v=>v.owner||("c-"+slug(v.ch));
const chName=v=>v.owner?((G.users[v.owner]||{}).ch||"Kanal"):v.ch;
const isMine=v=>!!(me&&v.owner===me);
const find=id=>vids.find(v=>v.id===id);
const viewsOf=v=>(v.base||0)+Object.keys(G.views[v.id]||{}).length;
const likes=v=>(v.sample?Math.round(v.base/40):0)+(S.lk[v.id]?1:0);
const ago=v=>{if(!v.ts)return v.ago||"";const m=(Date.now()-v.ts)/6e4;return m<2?"hozirgina":m<60?Math.floor(m)+" daqiqa oldin":m<1440?Math.floor(m/60)+" soat oldin":Math.floor(m/1440)+" kun oldin"};
const ini=s=>esc((s||"S")[0].toUpperCase());
const link=id=>location.href.split("#")[0]+"#video-"+id;
const hist=id=>{S.hist=[id].concat((S.hist||[]).filter(x=>x!==id)).slice(0,20);saveS()};
const thumb=v=>v.src?`<video src="${v.src}#t=0.5" preload="metadata" muted playsinline></video>`:"";
const ql=(w,h)=>{const M=Math.max(w,h);return M>=7680?"8K":M>=3840?"4K":M>=2560?"1440p":M>=1920?"1080p":M>=1280?"720p":M>=854?"480p":"360p"};
const bgf=v=>`linear-gradient(135deg,${v.g||"#334,#556"})`;
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2400)}
const IC={heart:'<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',chat:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>',share:'<svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8 11l8-4M8 13l8 4"/></svg>',bm:'<svg viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></svg>'};
const SHI='<svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="4"/><path class="tri" d="M10.5 9.5l4 2.5-4 2.5z"/></svg>';
const IUP='<svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>';
const IG='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>';
let f="Hammasi",term="",sopen=false,cmv=null,cmS=null,ctab="v",csort="new";

/* ===== IndexedDB (videolar) ===== */
const idb=()=>new Promise((res,rej)=>{try{const r=indexedDB.open("vidly",1);r.onupgradeneeded=()=>r.result.createObjectStore("v",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
const dbAll=async()=>{try{const d=await idb();return await new Promise(r=>{const q=d.transaction("v").objectStore("v").getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])})}catch(e){return[]}};
const dbPut=async o=>{const d=await idb();return new Promise((r,j)=>{const t=d.transaction("v","readwrite");t.objectStore("v").put(o);t.oncomplete=r;t.onerror=()=>j(t.error)})};
const dbDel=async id=>{try{const d=await idb();return await new Promise(r=>{const t=d.transaction("v","readwrite");t.objectStore("v").delete(id);t.oncomplete=r;t.onerror=r})}catch(e){}};
function own(r){if(!r.owner&&me){r.owner=me;dbPut(r).catch(()=>{})}return{id:r.id,t:r.t,c:r.c,kind:r.kind,owner:r.owner||"",ch:"",base:0,d:mmss(r.dur),src:URL.createObjectURL(r.blob),ts:r.ts,adult:r.adult,ww:r.ww,hh:r.hh}}

/* ===== Monetizatsiya hisob-kitobi ===== */
const MG=u=>G.mon[u]=G.mon[u]||{segs:[],pending:null,rej:""};
const segs=u=>(G.mon[u]||{}).segs||[];
const monActive=u=>segs(u).some(s=>!s.u||s.u>Date.now());
function closeSegs(u){const m=MG(u);m.segs.forEach(s=>{if(!s.u||s.u>Date.now())s.u=Date.now()})}
function grant(u,ms){closeSegs(u);MG(u).segs.push({f:Date.now(),u:ms?Date.now()+ms:0});MG(u).pending=null;saveG()}
function stats(u){
  const vs=vids.filter(v=>v.owner===u);let views=0,hrs=0,conf=0,pend=0;const now=Date.now(),sg=segs(u);
  vs.forEach(v=>{const vw=Object.values(G.views[v.id]||{});views+=vw.length;if(v.kind==="long")hrs+=(G.secs[v.id]||0)/3600;
    vw.forEach(ts=>{if(sg.some(s=>ts>=s.f&&(!s.u||ts<=s.u))){ts<=now-HOLD?conf++:pend++}})});
  return{subs:subsOf(u),views,hrs,conf,pend,usd:Math.floor(conf/1000)*10,pusd:pend/100,vids:vs.length};
}
const paid=u=>G.wd.filter(w=>w.uid===u&&w.st!=="Rad etilgan").reduce((a,w)=>a+w.amt,0);
const OP=["20","33","50","55","77","88","90","91","93","94","95","97","98","99"];
const okPh=p=>/^\d{9}$/.test(p)&&OP.includes(p.slice(0,2));

/* ===== Router ===== */
const go=h=>{if(location.hash.slice(1)===h)route();else location.hash=h};
function pageSetup(){const m=$("main");document.body.classList.remove("sh");$("tabs").style.display="none";m.classList.remove("flush");window.scrollTo(0,0);return m}
function route(){clearInterval(payTimer);if(window.__kd){document.removeEventListener("keydown",window.__kd);window.__kd=null}
  const h=location.hash.slice(1),vid=h.startsWith("video-")?h.slice(6):null,v=vid&&find(vid);
  if(v&&v.adult&&S.age!=="adult"){
    if(S.age==="minor"){toast("Bu video 18+ — yoshingizga mos emas");go("");return}
    if(!$("agd").open)$("agd").showModal();return;
  }
  const isSh=h==="shorts"||(v&&v.kind==="short");
  const P=["profile","studio","telefon","admin","sozlamalar","yordam","channel","jonli"];
  const tab=isSh?"shorts":h==="upload"?"upload":(P.includes(h)||h.startsWith("ch-")||h.startsWith("pay-")||h.startsWith("ad-"))?"profile":"home";

  else if(h.startsWith("ad-"))adPage(m,h.slice(3));

  decorate();
}
function decorate(){

  if(n){if(u&&u.avatar){n.style.backgroundImage=`url(${u.avatar})`;n.style.backgroundSize="cover";n.textContent=""}else{n.style.backgroundImage="";n.textContent=(u?u.ch:"S")[0].toUpperCase()}}

}
function buildMenu(){
  const I=p=>`<svg viewBox="0 0 24 24">${p}</svg>`;
  const MI=[["channel",me?"Mening kanalim":"Kanal ochish",'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5l5 2.5-5 2.5z"/>'],["saved","Saqlanganlar",'<path d="M6 4h12v17l-6-4-6 4z"/>'],["keyinroq","Keyinroq koʻrish",'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],["tarix","Tomosha tarixi",'<path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/>'],["studio","Studio va monetizatsiya",'<circle cx="12" cy="12" r="9"/><path d="M9 9h4.5a2 2 0 0 1 0 4h-3a2 2 0 0 0 0 4H15M12 6.5V9m0 8v1.5"/>'],["telefon","Telefon raqam ulash",'<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>'],["upload","Video yaratish",'<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/>'],["jonli","Jonli efir (OBS)",'<circle cx="12" cy="12" r="3"/><path d="M7 7a7 7 0 0 0 0 10M17 7a7 7 0 0 1 0 10"/>']];

const stp=n=>`<div class="stp">${["Kanal","Video","Auditoriya"].map((t,i)=>`<div class="${i+1<n?"d":i+1===n?"c":""}"><i>${i+1<n?"✓":i+1}</i>${t}</div>`).join("<hr>")}</div>`;
function upload(m){
  if(!me){
    m.innerHTML=`<div class="box" style="max-width:560px">${stp(1)}<div class="sec" style="text-align:center;justify-items:center"><div class="dzi">${IUP}</div><h3>1-qadam: kanal oching</h3><span class="meta">Video yuklashdan oldin kanal ochiladi: nom, @user, avatar va banner.</span><button id="mk">Kanal ochish</button></div></div>`;
    $("mk").onclick=()=>{window.toUp=true;go("channel")};return;
  }
  const touch=matchMedia("(pointer:coarse)").matches;
  let file=null,dur=0,kind="long",vw=0,vh=0,aud="";
  m.innerHTML=`<div class="box" style="max-width:640px"><h2 style="margin:0">Video yuklash</h2><div id="sp">${stp(2)}</div>
  <input type="file" id="fi" accept="video/*" hidden><input type="file" id="fc" accept="video/*" capture="environment" hidden>
  <div class="dz" id="dz"><div class="dzi">${IUP}</div><b style="font-size:1.1rem">${touch?"Galereyadan video tanlang":"Videoni bu yerga tashlang"}</b><span class="meta">${touch?"Telefoningiz galereyasi ochiladi":"yoki kompyuterdagi fayldan tanlang"}<br>MP4, MOV, WebM · 4K ham mumkin · 2 GB gacha</span><div class="row" style="justify-content:center;margin-top:6px"><button id="pk" style="flex:none">${touch?"Galereya":"Fayl tanlash"}</button>${touch?'<button class="ghost" id="cam" style="flex:none">📸 Kamera</button>':""}</div></div>
  <div id="fm" class="sec" hidden><div class="vbox" id="pv"><video id="pvv" controls playsinline></video></div>
  <div class="tools" id="bd"></div><div class="meta" id="inf"></div>
  <input id="ut" placeholder="Video nomi" maxlength="80"><select id="uc">${cats.map(c=>`<option>${c}</option>`).join("")}</select>
  <div class="lab">Bu video kimlar uchun?</div>
  <div class="aud"><button class="ac" data-a="minor"><b>👶 18 yoshdan kichiklar uchun</b><span>Bolalar va oʻsmirlar ham koʻra oladi</span></button><button class="ac" data-a="adult"><b>🔞 18 yoshdan kattalar uchun</b><span>Faqat kattalarga koʻrsatiladi</span></button></div>
  <div id="vdc" hidden></div>
  <label class="tg" style="align-items:flex-start;gap:10px"><input type="checkbox" id="tos" style="margin-top:4px"><span class="meta">Videoda pornografik, shafqatsiz zoʻravonlik yoki boshqa taqiqlangan kontent yoʻqligini tasdiqlayman.</span></label>
  <div class="upb" id="ub" hidden><i id="ui"></i></div><button id="ok" disabled>Yuklash</button><button class="ghost" id="re">Boshqa video tanlash</button></div>
  <span class="meta">Video shu brauzerda saqlanadi. Boshqa qurilmalarga koʻrinishi uchun server kerak.</span></div>`;
  const chk=()=>{$("ok").disabled=!(file&&$("ut").value.trim()&&aud&&$("tos").checked)};
  const handle=fl=>{
    if(!fl)return;
    if(!/^video\//.test(fl.type)&&!/\.(mp4|mov|webm|mkv|m4v|3gp)$/i.test(fl.name))return toast("Faqat video fayl tanlang");
    if(fl.size>2048*1048576)return toast("Fayl 2 GB dan oshmasin");
    file=fl;const vv=$("pvv");vv.src=URL.createObjectURL(fl);
    vv.onloadedmetadata=()=>{
      dur=vv.duration||0;vw=vv.videoWidth;vh=vv.videoHeight;
      kind=vw<=vh?"short":"long";
      const r=vw/vh,asp=Math.abs(r-9/16)<.04?"9:16":Math.abs(r-16/9)<.04?"16:9":(vw<=vh?"vertikal":"gorizontal");
      $("pv").classList.toggle("s",vw<=vh);
      $("bd").innerHTML=`<span class="badge">${kind==="short"?"📱 Short":"🎬 Long"} · ${asp} (avtomatik)</span><span class="badge q">${ql(vw,vh)}</span><span class="badge">${vw}×${vh}</span>`;
      $("inf").textContent=fl.name+" · "+mmss(dur)+" · "+(fl.size/1048576).toFixed(1)+" MB";
      if(!$("ut").value)$("ut").value=fl.name.replace(/\.[^.]+$/,"");
      $("dz").hidden=true;$("fm").hidden=false;$("sp").innerHTML=stp(3);chk();
    };
    vv.onerror=()=>{file=null;toast("Bu video formatini oʻqib boʻlmadi (H.264 MP4 tavsiya)")};
  };
  $("pk").onclick=()=>$("fi").click();const cam=$("cam");if(cam)cam.onclick=()=>$("fc").click();
  $("fi").onchange=e=>handle(e.target.files[0]);$("fc").onchange=e=>handle(e.target.files[0]);
  const dz=$("dz");
  ["dragenter","dragover"].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add("over")}));
  ["dragleave","drop"].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.remove("over")}));
  dz.addEventListener("drop",e=>handle(e.dataTransfer.files[0]));
  dz.onclick=e=>{if(!e.target.closest("button"))$("fi").click()};
  $("re").onclick=()=>{file=null;$("fm").hidden=true;$("dz").hidden=false;$("sp").innerHTML=stp(2);$("pvv").removeAttribute("src");$("fi").value=""};
  $("ut").oninput=chk;$("tos").onchange=chk;
  m.querySelectorAll(".ac").forEach(b=>b.onclick=()=>{
    aud=b.dataset.a;m.querySelectorAll(".ac").forEach(x=>x.classList.toggle("on",x===b));
    const d=$("vdc");d.hidden=false;d.className="vdc "+(aud==="minor"?"g":"w");
    d.innerHTML=aud==="minor"?"✅ <b>Bu video 18 yoshdan kichiklarga ham, kattalarga ham mos keladi.</b> U hamma yoshdagi foydalanuvchilarga koʻrsatiladi.":"🔞 <b>Bu video 18 yoshdan kattalar uchun mos.</b> 18 dan kichik foydalanuvchilarga koʻrsatilmaydi va ochishdan oldin yosh tasdiqlanadi.";
    chk();
  });
  $("ok").onclick=async()=>{
    const t=$("ut").value.trim();if(!file||!t||!aud)return;
    const id="u"+Date.now().toString(36),rec={id,t,c:$("uc").value,kind,dur,blob:file,ts:Date.now(),adult:aud==="adult",ww:vw,hh:vh,owner:me};
    $("ok").disabled=true;$("ub").hidden=false;let p=5;$("ui").style.width="5%";
    const iv=setInterval(()=>{p=Math.min(90,p+8);$("ui").style.width=p+"%"},250);
    try{await dbPut(rec)}catch(e){toast("Brauzer xotirasi toʻlgan: video faqat shu sessiyada qoladi")}
    clearInterval(iv);$("ui").style.width="100%";
    vids.unshift(own(rec));toast(kind==="short"?"Short yuklandi ✓":"Video yuklandi ✓");setTimeout(()=>go("video-"+id),350);
  };
}

function img2url(file,w,h){return new Promise((res,rej)=>{const i=new Image(),u=URL.createObjectURL(file);i.onload=()=>{const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d"),r=Math.max(w/i.width,h/i.height),dw=i.width*r,dh=i.height*r;x.drawImage(i,(w-dw)/2,(h-dh)/2,dw,dh);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.82))};i.onerror=rej;i.src=u})}
function chInfo(id){const u=G.users[id];if(u)return{id,name:u.ch,user:u.user,avatar:u.avatar,banner:u.banner,real:true};const v=vids.find(x=>chId(x)===id);return v?{id,name:v.ch,user:id.slice(2),avatar:"",banner:"",real:false}:null}

  <div class="ban" ${inf.banner?`style="background-image:url(${inf.banner})"`:""}>${inf.banner?"":"Vidly"}</div>

  <div class="pills">${mineC?'<button class="pill" id="an"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 17v-5M12 17V8M16 17v-3"/></svg>Analytics</button><button class="pill" id="ed"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/></svg>Kanalni tahrirlash</button>':`<button class="pill" id="sb" style="${isSub(id)?"":"background:var(--text);color:var(--bg)"}">${isSub(id)?"Obuna boʻlingan":"Obuna"}</button>${G.live[id]&&CFG.HLS_BASE?'<button class="pill" id="lvb">🔴 Jonli</button>':""}`}</div>

/* ===== Telefon ===== */
let smsSent="",smsAt=0;
function phonePage(m){
  if(!me){m.innerHTML='<div class="box"><div class="sec" style="text-align:center"><h3>Avval kanal oching</h3><button id="mk">Kanal ochish</button></div></div>';$("mk").onclick=()=>go("channel");return}
  const u=G.users[me];
  m.innerHTML=`<div class="box" style="max-width:520px"><h2 style="margin:0">Telefon raqam ulash</h2>
  <div class="sec">${u.phoneOk?`<div class="good">✔ Ulangan: +998 ${esc(u.phone)}</div><button class="ghost" id="chg">Raqamni almashtirish</button>`:`<span class="meta">Monetizatsiya faqat Oʻzbekiston raqamlari uchun. 9 xonali raqamni kiriting.</span>
  <div class="phr"><span>+998</span><input id="ph" inputmode="numeric" maxlength="9" placeholder="90 123 45 67" autocomplete="tel"></div><div id="pe"></div>
  <button id="sd" disabled>SMS yuborish</button>
  <div id="cd" hidden><span class="good" id="cm1"></span><input id="cod" inputmode="numeric" maxlength="6" placeholder="SMS kod"><button id="vf">Tasdiqlash</button></div>`}</div></div>`;
  if(u.phoneOk){$("chg").onclick=()=>{u.phoneOk=false;u.phone="";saveG();phonePage(m)};return}
  const chk=()=>{
    const p=$("ph").value.replace(/\D/g,"");$("ph").value=p;const e=$("pe");
    if(!p){e.className="";e.textContent="";$("sd").disabled=true;return false}
    if(p.length<9){e.className="no";e.textContent="9 ta raqam kerak ("+p.length+"/9)";$("sd").disabled=true;return false}
    if(!okPh(p)){e.className="bad";e.textContent="✖ Faqat Oʻzbekiston raqami qabul qilinadi (masalan 90 123 45 67)";$("sd").disabled=true;return false}
    if(Object.values(G.users).some(x=>x.uid!==me&&x.phoneOk&&x.phone===p)){e.className="bad";e.textContent="✖ Bu raqam boshqa kanalga ulangan";$("sd").disabled=true;return false}
    e.className="good";e.textContent="✔ Raqam toʻgʻri";$("sd").disabled=false;return true;
  };
  $("ph").oninput=chk;
  $("sd").onclick=async()=>{
    if(!chk())return;const p=$("ph").value;
    if(Date.now()-smsAt<60000)return toast("Kod yuborilgan. "+Math.ceil((60000-(Date.now()-smsAt))/1000)+" soniyadan keyin qayta yuboring");
    $("sd").disabled=true;
    try{await SMS.send(p);smsAt=Date.now();smsSent=p;$("cd").hidden=false;$("cm1").textContent="SMS yuborildi. Kodni kiriting.";$("cod").focus()}
    catch(e){const el=$("pe");el.className="bad";el.textContent=e.message==="NO_SERVER"?"✖ Server ulanmagan, SMS yuborib boʻlmaydi. Server manzilini CFG.API_URL ga yozing.":"✖ SMS yuborilmadi. Keyinroq urinib koʻring.";$("sd").disabled=false}
  };
  $("vf").onclick=async()=>{
    const c=$("cod").value.trim();if(c.length<4||!smsSent)return toast("SMS kodni kiriting");
    try{const ok=await SMS.verify(smsSent,c);if(!ok)return toast("Kod notoʻgʻri");u.phone=smsSent;u.phoneOk=true;saveG();toast("Raqam ulandi ✓");phonePage(m)}
    catch(e){toast("Tekshirib boʻlmadi")}
  };
}

/* ===== Studio / monetizatsiya ===== */
function studio(m){
  if(!me){m.innerHTML='<div class="box"><div class="sec" style="text-align:center"><h3>Studio uchun kanal kerak</h3><button id="mk">Kanal ochish</button></div></div>';$("mk").onclick=()=>go("channel");return}
  const u=G.users[me],st=stats(me),mg=MG(me),act=monActive(me),had=mg.segs.length>0;
  const okS=st.subs>=1000,okV=st.views>=10000,okH=st.hrs>=2000,okAny=okV||okH;
  const bal=Math.max(0,st.usd*RATE-paid(me));
  const pr=(l,a,b,ok)=>`<div><div class="row" style="justify-content:space-between"><span>${l}</span><span class="${ok?"good":"no"}">${fmt(Math.floor(a))} / ${fmt(b)}${ok?" ✔":""}</span></div><div class="bar"><i style="width:${Math.min(100,a/b*100)}%"></i></div></div>`;
  const dateS=t=>new Date(t).toLocaleDateString("ru-RU");
  const status=act?`<div class="good">✔ Monetizatsiya yoqilgan${(segs(me).find(s=>s.u>Date.now())||{}).u?" — "+dateS(segs(me).find(s=>s.u>Date.now()).u)+" gacha":""}</div>`:mg.pending?'<div class="no" style="color:#d97706;font-weight:600">⏳ Ariza yuborilgan — Vidly adminlari tekshirmoqda</div>':mg.rej?`<div class="bad">✖ Ariza rad etilgan: ${esc(mg.rej)}</div>`:"";
  m.innerHTML=`<div class="box" style="max-width:640px"><h2 style="margin:0">Studio</h2>
  ${had?`<div class="stc"><div><small>Koʻrishlar (monetizatsiyadan keyin)</small><b>${fmt(st.conf+st.pend)}</b></div><div><small>Daromad (tasdiqlangan)</small><b>$${st.usd}</b></div><div><small>Kutilmoqda (${HOLD/DAY} kun ushlanadi)</small><b>$${st.pusd.toFixed(2)}</b></div><div><small>Yechish mumkin</small><b>${fmt(bal)} soʻm</b></div></div>`:""}
  <div class="sec"><h3>Telefon</h3>${u.phoneOk?`<div class="good">✔ +998 ${esc(u.phone)}</div>`:'<div class="no">Raqam ulanmagan. Monetizatsiyaga ariza berish uchun raqam kerak.</div>'}<button class="ghost" id="tp">${u.phoneOk?"Raqamni boshqarish":"Telefon raqam ulash"}</button></div>
  <div class="sec"><h3>Monetizatsiya shartlari</h3>${pr("Obunachilar (shart)",st.subs,1000,okS)}<span class="meta">Quyidagi 2 tadan 1 tasi kerak:</span>${pr("Koʻrishlar (alohida tomoshabinlar)",st.views,10000,okV)}${pr("Long video koʻrish soati",st.hrs,2000,okH)}
  <span class="meta">Har bir tomoshabin videoni faqat 1 marta hisoblanadi. Monetizatsiya yoqilgandan keyingi koʻrishlar hisoblanadi, daromad ${HOLD/DAY} kundan soʻng tasdiqlanadi. Har 1000 koʻrish = $10.</span></div>
  ${had?`<div class="sec"><h3>Yechib olish</h3><span class="meta">1 $ ≈ ${fmt(RATE)} soʻm · minimal 1 000 000, maksimal 10 000 000 soʻm</span><input id="cn" inputmode="numeric" placeholder="Karta raqami (16 xonali)" maxlength="19"><input id="am" inputmode="numeric" placeholder="Summa (soʻm)"><button id="wd">Yechib olish soʻrovi</button>${G.wd.filter(w=>w.uid===me).map(w=>`<div class="meta">${dateS(w.ts)} · ${fmt(w.amt)} soʻm · •••• ${w.c} · ${w.st}</div>`).join("")}</div>`:""}
  <div class="sec"><h3>Monetizatsiya tarifi</h3><span class="meta">Toʻlov tasdiqlangach monetizatsiya tanlangan muddatga yoqiladi. Toʻlov karta orqali, chek 5 daqiqa ichida yuboriladi.</span><div class="plans">${PLANS.map(p=>`<button class="plan" data-k="${p.k}"><b>${p.l}</b><span>$${p.usd}</span><small>${p.note||"≈ "+fmt(p.usd*RATE)+" soʻm"}</small></button>`).join("")}</div></div>
  <div class="sec"><h3>Ariza</h3>${status}<button id="ap">Ariza berish</button><span class="meta">Shartlar toʻlmasdan ham ariza berish mumkin; adminlar koʻrib chiqadi.</span></div>
  ${isAdmin(me)?'<button class="ghost" id="adm">Admin paneli</button>':""}</div>`;
  $("tp").onclick=()=>go("telefon");
  m.querySelectorAll(".plan").forEach(b=>b.onclick=()=>startPay("mon",b.dataset.k));
  const a=$("adm");if(a)a.onclick=()=>go("admin");
  $("ap").onclick=()=>{
    if(!u.phoneOk){toast("Avval telefon raqamini ulang");go("telefon");return}
    if(act)return toast("Monetizatsiya allaqachon yoqilgan");
    if(mg.pending)return toast("Ariza allaqachon yuborilgan");
    mg.pending={ts:Date.now(),subs:st.subs,views:st.views,hrs:st.hrs};mg.rej="";saveG();toast("Ariza yuborildi ✓");studio(m);
  };
  const w=$("wd");if(w)w.onclick=()=>{
    const c=$("cn").value.replace(/\s/g,""),amt=parseInt($("am").value.replace(/\D/g,""),10)||0;
    if(!/^\d{16}$/.test(c))return toast("Karta raqami 16 xonali boʻlsin");
    if(amt<1e6)return toast("Minimal summa 1 000 000 soʻm");
    if(amt>1e7)return toast("Maksimal summa 10 000 000 soʻm");
    if(amt>bal)return toast("Yechish mumkin boʻlgan balans yetarli emas");
    G.wd.unshift({id:rid(),uid:me,amt,c:c.slice(-4),st:"Kutilmoqda",ts:Date.now()});saveG();toast("Soʻrov yuborildi");studio(m);
  };
}

}

/* ===== Tariflar, to'lov, reklama ===== */
let payTimer=0;
const isAd=v=>!!(G.ads[v.id]&&G.ads[v.id].until>Date.now());
function extend(u,ms){const mg=MG(u),now=Date.now(),open=mg.segs.find(s=>!s.u||s.u>now);if(open){if(!open.u)return;open.u+=ms}else mg.segs.push({f:now,u:now+ms});mg.pending=null;saveG()}
function extendAd(vid,ms){const a=G.ads[vid],base=a&&a.until>Date.now()?a.until:Date.now();G.ads[vid]={until:base+ms};saveG()}
function img2fit(file,mw){return new Promise((res,rej)=>{const i=new Image(),u=URL.createObjectURL(file);i.onload=()=>{const r=Math.min(1,mw/i.width),c=document.createElement("canvas");c.width=Math.round(i.width*r);c.height=Math.round(i.height*r);c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.72))};i.onerror=rej;i.src=u})}
function startPay(type,key,vid){
  if(!me)return go("channel");
  const P=(type==="mon"?PLANS:ADS).find(p=>p.k===key);if(!P)return;
  const ex=G.pay.find(p=>p.uid===me&&p.st==="kutilmoqda"&&p.dl>Date.now()&&p.type===type&&p.plan===key&&p.vid===(vid||""));
  const rec=ex||{id:rid(),uid:me,type,plan:key,vid:vid||"",usd:P.usd,ms:P.ms,l:P.l,ts:Date.now(),dl:Date.now()+5*60000,st:"kutilmoqda",img:""};
  if(!ex){G.pay.unshift(rec);saveG()}
  go("pay-"+rec.id);
}
function payPage(m,id){
  clearInterval(payTimer);
  const p=G.pay.find(x=>x.id===id);
  if(!p||p.uid!==me){m.innerHTML='<div class="empty">Toʻlov topilmadi.</div>';return}
  if(p.st==="kutilmoqda"&&p.dl<=Date.now()){p.st="muddat";saveG()}
  const v=p.vid?find(p.vid):null,what=p.type==="mon"?"Monetizatsiya — "+p.l:"Reklama — "+(v?v.t:"video")+" — "+p.l;
  const sum=`<div class="sec"><h3>${esc(what)}</h3><div style="font-size:1.6rem;font-weight:800">$${p.usd} <span class="meta">≈ ${fmt(p.usd*RATE)} soʻm</span></div></div>`;
  const back=p.type==="mon"?"studio":"video-"+p.vid;
  if(p.st!=="kutilmoqda"){
    const msg={chek:'<div class="vdc g">✔ <b>Toʻlovingiz tez orada tasdiqlanadi.</b> Chek adminga yuborildi.</div>',tasdiqlangan:'<div class="vdc g">✔ <b>Toʻlov tasdiqlandi.</b> '+(p.type==="mon"?"Monetizatsiya yoqildi.":"Reklama boshlandi.")+'</div>',rad:'<div class="vdc w">✖ <b>Toʻlov rad etildi.</b> '+esc(p.why||"")+'</div>',muddat:'<div class="vdc w">⏱ <b>Vaqt tugadi.</b> Chek 5 daqiqa ichida yuborilishi kerak edi. Qaytadan boshlang.</div>'}[p.st];
    m.innerHTML=`<div class="box" style="max-width:560px"><h2 style="margin:0">Toʻlov</h2>${sum}${msg}<button id="bk2">${p.st==="muddat"||p.st==="rad"?"Qaytadan boshlash":"Orqaga"}</button></div>`;
    $("bk2").onclick=()=>p.st==="muddat"||p.st==="rad"?go(p.type==="mon"?"studio":"ad-"+p.vid):go(back);return;
  }
  const card=(G.cfg&&G.cfg.card)||"";let img="";
  m.innerHTML=`<div class="box" style="max-width:560px"><h2 style="margin:0">Toʻlov</h2>${sum}
  <div class="sec"><h3>1. Karta orqali toʻlang</h3>${card?`<div style="font-size:1.4rem;font-weight:800;letter-spacing:1px">${esc(card.replace(/(\d{4})(?=\d)/g,"$1 "))}</div><div class="meta">${esc((G.cfg&&G.cfg.holder)||"")}</div><button class="ghost" id="cc">Nusxalash</button>`:'<div class="bad">✖ Admin hali karta raqamini kiritmagan.</div>'}</div>
  <div class="sec"><h3>2. Chek yuboring <span id="tm" class="good"></span></h3><span class="meta">Toʻlovdan soʻng chek rasmini 5 daqiqa ichida yuboring.</span>
  <input type="file" id="fi" accept="image/*" hidden><button class="ghost" id="pk">📸 Chek rasmini tanlash</button><img id="pv" alt="Chek" hidden style="max-width:100%;border-radius:10px"><button id="sd" disabled>Chek yuborish</button></div></div>`;
  const tick=()=>{const l=p.dl-Date.now();if(l<=0){clearInterval(payTimer);payPage(m,id);return}$("tm").textContent=String(Math.floor(l/60000)).padStart(2,"0")+":"+String(Math.floor(l/1000)%60).padStart(2,"0")};
  tick();payTimer=setInterval(tick,1000);
  const cc=$("cc");if(cc)cc.onclick=()=>{copy(card);toast("Karta raqami nusxalandi")};
  $("pk").onclick=()=>$("fi").click();
  $("fi").onchange=async e=>{const fl=e.target.files[0];if(!fl)return;try{img=await img2fit(fl,900);$("pv").src=img;$("pv").hidden=false;$("sd").disabled=false}catch(x){toast("Rasm oʻqilmadi")}};
  $("sd").onclick=()=>{
    if(!img)return;
    if(Date.now()>p.dl){p.st="muddat";saveG();payPage(m,id);return}
    p.img=img;p.st="chek";p.sent=Date.now();saveG();clearInterval(payTimer);toast("Chek yuborildi ✓");payPage(m,id);
  };
}
function adPage(m,vid){
  const v=find(vid);
  if(!v||!isMine(v)){m.innerHTML='<div class="empty">Video topilmadi.</div>';return}
  const a=G.ads[vid],act=a&&a.until>Date.now();
  m.innerHTML=`<div class="box" style="max-width:560px"><h2 style="margin:0">Videoni reklama qilish</h2><div class="sec"><b>${esc(v.t)}</b>${act?`<div class="good">✔ Reklama faol: ${new Date(a.until).toLocaleString("ru-RU")} gacha</div>`:""}<span class="meta">Reklama qilingan video bosh sahifa va Shorts boshida “Reklama” belgisi bilan chiqadi. Toʻlov karta orqali, chek 5 daqiqa ichida yuboriladi.</span></div>
  <div class="plans">${ADS.map(p=>`<button class="plan" data-k="${p.k}"><b>${p.l}</b><span>$${p.usd}</span><small>≈ ${fmt(p.usd*RATE)} soʻm</small></button>`).join("")}</div><button class="ghost" id="bk3">← Orqaga</button></div>`;
  m.querySelectorAll(".plan").forEach(b=>b.onclick=()=>startPay("ad",b.dataset.k,vid));
  $("bk3").onclick=()=>go("video-"+vid);
}

/* ===== Jonli efir (OBS) ===== */
const rkey=()=>Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,"0")).join("");
function livePage(m){
  if(!me){m.innerHTML='<div class="box"><div class="sec" style="text-align:center"><h3>Jonli efir uchun kanal kerak</h3><button id="mk">Kanal ochish</button></div></div>';$("mk").onclick=()=>go("channel");return}
  const L=G.live[me]=G.live[me]||{key:rkey(),pub:rkey().slice(0,12),title:"",ts:Date.now()};saveG();
  const lurl=location.href.split("#")[0]+"#live-"+me;
  m.innerHTML=`<div class="box" style="max-width:620px"><h2 style="margin:0">Jonli efir (OBS)</h2>
  <div class="sec"><h3>1. Efir nomi</h3><input id="lt" maxlength="80" placeholder="Efir nomi" value="${esc(L.title)}"><button id="ls">Saqlash</button></div>
  <div class="sec"><h3>2. OBS sozlamalari</h3>
  <ol class="meta"><li>OBS Studio → <b>Sozlamalar → Efir</b>: Xizmat — “Maxsus…”.</li><li>Quyidagi <b>Server</b> va <b>Stream key</b> ni kiriting.</li><li><b>Chiqish</b>: kodek x264, bitrate 4500–6000 kbps (1080p), keyframe interval 2 s, audio AAC.</li><li>OBS’da “Efirni boshlash” ni bosing.</li></ol>
  <div class="lab">Server (RTMP)</div><input readonly value="${esc(CFG.RTMP_URL)}" placeholder="Server ulanmagan">
  <div class="lab">Stream key (hech kimga bermang)</div><div class="row"><input id="kk" readonly value="${esc(L.key)}" style="flex:3"><button class="ghost" id="kc" style="flex:1">Nusxalash</button></div>
  <button class="ghost" id="kr">Yangi kalit yaratish</button>
  ${CFG.RTMP_URL&&CFG.HLS_BASE?"":'<div class="bad">✖ Server ulanmagan: efir uchun RTMP qabul qiluvchi server kerak (CFG.RTMP_URL va CFG.HLS_BASE).</div>'}</div>
  <div class="sec"><h3>3. Tomosha havolasi</h3><input readonly id="lu" value="${esc(lurl)}"><div class="row"><button class="ghost" id="lc">Nusxalash</button><button class="ghost" id="lo">Efir sahifasi</button></div></div></div>`;
  $("ls").onclick=()=>{L.title=$("lt").value.trim();saveG();toast("Saqlandi")};
  $("kc").onclick=()=>{copy(L.key);toast("Kalit nusxalandi")};
  $("kr").onclick=()=>{L.key=rkey();L.pub=rkey().slice(0,12);saveG();livePage(m)};
  $("lc").onclick=()=>{copy(lurl);toast("Havola nusxalandi")};
  $("lo").onclick=()=>go("live-"+me);
}
function loadHls(vd,src,st){
  if(vd.canPlayType("application/vnd.apple.mpegurl")){vd.src=src;vd.onerror=()=>{st.textContent="Efir hozir yoqilmagan."};return}
  const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js";
  s.onload=()=>{if(window.Hls&&Hls.isSupported()){const h=new Hls({lowLatencyMode:true});h.loadSource(src);h.attachMedia(vd);h.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)st.textContent="Efir hozir yoqilmagan yoki uzildi."})}else st.textContent="Brauzer HLS ni qoʻllamaydi."};
  s.onerror=()=>{st.textContent="Pleyer yuklanmadi."};document.head.appendChild(s);
}
function liveView(m,uid){
  const u=G.users[uid],L=G.live[uid];
  if(!u||!L){m.innerHTML='<div class="empty">Efir topilmadi.</div>';return}
  m.innerHTML=`<button class="ghost" id="bk" style="margin-bottom:10px">← Orqaga</button><div class="vbox"><video id="lv" controls playsinline autoplay muted></video></div>
  <h2 style="margin:12px 0 2px;font-size:1.1rem">🔴 ${esc(L.title||u.ch+" — jonli efir")}</h2><div class="meta" id="lst"></div>
  <div class="sec" style="margin-top:10px"><div class="row" style="flex-wrap:nowrap;cursor:pointer" id="chr"><div class="av">${ini(u.ch)}</div><b style="flex:3">${esc(u.ch)}</b></div></div>`;
  $("bk").onclick=()=>history.length>1?history.back():go("");
  $("chr").onclick=()=>go(uid===me?"channel":"ch-"+uid);
  const st=$("lst");
  if(!CFG.HLS_BASE)st.textContent="Server ulanmagan: efir hozircha mavjud emas.";
  else loadHls($("lv"),CFG.HLS_BASE.replace(/\/$/,"")+"/"+L.pub+".m3u8",st);
}

dbAll().then(rs=>{rs.sort((a,b)=>a.ts-b.ts).forEach(r=>{if(!find(r.id))vids.unshift(own(r))});route()});
